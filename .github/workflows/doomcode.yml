# Based on https://github.com/mvdan/github-actions-golang
# Freshen this.

on: [push, pull_request]
name: doomcode

jobs:
  test:
    strategy:
      matrix:
        go-version: [1.25.x, 1.26.x]
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: editor
    env:
      GO111MODULE: on
      acmeshell: sh

    steps:
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check gofmt
      run: diff -u <(echo -n) <(gofmt -d -s .)
      shell: bash

    - name: Run go vet
      run: go vet .

    - name: Install staticcheck and misspell
      run: |
        go install honnef.co/go/tools/cmd/staticcheck@v0.6.1
        go install github.com/client9/misspell/cmd/misspell@v0.3.4
      working-directory: /
      shell: bash

    - name: Run staticcheck
      run: staticcheck -checks inherit,-U1000,-SA4003 ./...

    - name: Run misspell
      run: misspell -error .

    - name: Run Go tests
      # Failing test lines become annotations, readable without access to
      # the raw log.
      run: |
        set +e  # the runner's bash has -e and pipefail; keep going to report
        go test -v -race -coverprofile coverage.txt -covermode atomic ./... 2>&1 | tee test.log
        status=${PIPESTATUS[0]}
        if [ "$status" != 0 ]; then
          # One multi-line annotation: GitHub shows at most ten per step.
          msg=$({ grep -E -A6 -- '--- FAIL|^panic:' test.log || tail -40 test.log; } | head -120 | tr -d '\r' | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=go test failed::$msg"
        fi
        exit $status
      shell: bash

    # Syn and Diag: tree-sitter grammars need cgo, so not on Windows.
    - name: Test Syn, Diag and acmefs
      if: matrix.os != 'windows-latest'
      run: go test ./cmd/... ./internal/...
      working-directory: .

    - name: Build with duitdraw on non-windows systems
      if: matrix.os != 'windows-latest'
      run: go get -tags 'duitdraw mux9p' -t -v ./...


    - name: Check if 'go get' modified go.mod file
      run: git diff --exit-code
